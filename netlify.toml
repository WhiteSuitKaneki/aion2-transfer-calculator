# Netlify: serves planner.html as the home page and runs the two price functions in netlify/functions
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/planner.html"
  status = 200

[functions]
  node_bundler = "esbuild" # bundles servers.json into the G2G functions
