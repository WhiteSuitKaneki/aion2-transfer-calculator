<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer Crafting Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Figtree:wght@400;500;600;700&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --abyss: #0d1424;
  --abyss-2: #111b30;
  --panel: #16213a;
  --panel-2: #1b2846;
  --line: #273759;
  --text: #ebe6d8;
  --muted: #9aa5c2;
  --faint: #66739a;
  --unique: #e3b24f;
  --true: #6fd6e8;
  --white: #dfe6f3;
  --wise: #b79cff;
  --good: #5fc9a8;
  --bad: #e8667f;
  --wrath: #e8667f;
  --balaur: #5fc9a8;
  --radiant: #f0cf7a;
  --stone: #b9c3d9;
  --path: var(--wise);
  --display: "Marcellus SC", "Palatino Linotype", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --num: "Chakra Petch", "Consolas", monospace;
}
body[data-path="true"] { --path: var(--true); }
body[data-path="white"] { --path: var(--white); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1000px 420px at 50% -8%, color-mix(in srgb, var(--path) 9%, transparent), transparent 70%), var(--abyss);
  color: var(--text); font: 15px/1.5 var(--body); min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 24px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-size: 21px; margin-right: auto; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); background: var(--panel); }
.chip b { color: var(--text); }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.status[data-state="live"] .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
.status[data-state="loading"] .dot { background: var(--unique); animation: pulse 1s infinite; }
.status[data-state="error"] .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .3; } }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--path); }

main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 64px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.warn { padding: 12px 16px; margin-bottom: 16px; border-color: var(--bad); color: var(--bad); font-size: 14px; }

/* 1. choices */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; padding: 18px 20px; margin-bottom: 20px; }
.field { display: grid; gap: 6px; align-content: start; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.field select { width: 100%; background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.field select:hover { border-color: var(--path); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 6px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--path) 20%, transparent); color: var(--path); }
.own { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.own input { accent-color: var(--path); width: 16px; height: 16px; }
.rate { display: flex; align-items: center; gap: 8px; }
.rate input { width: 110px; background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-family: var(--num); text-align: right; }
.rate input:hover { border-color: var(--path); }
.rate span, .rate a { font-size: 13px; color: var(--muted); }
.rate a:hover { color: var(--path); }
.usd { font: 500 13px var(--num); color: var(--muted); }
.rate-field { grid-column: 1 / -1; }
.tax { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-top: 10px; }
.tax input { width: 56px; background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-family: var(--num); text-align: right; }
.rate { flex-wrap: wrap; }
.rate input:disabled { color: var(--path); border-style: dashed; cursor: default; }
.rate select { background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.rate select:hover { border-color: var(--path); }
.g2g { font-size: 13px; color: var(--faint); }
.g2g b { color: var(--text); font-family: var(--num); }
.g2g a { color: var(--muted); }
.g2g a:hover { color: var(--path); }
.total-usd { text-align: right; font: 600 16px var(--num); color: var(--muted); margin-top: 2px; }

/* 2. answer */
h1 { font: 400 28px/1.15 var(--display); color: var(--unique); margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.answer { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-bottom: 28px; }
.receipt { padding: 20px; }
.receipt ol { list-style: none; margin: 0; padding: 0; }
.receipt li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.receipt li .what { font-weight: 500; grid-column: 1; }
.receipt li .why { grid-column: 1; font-size: 12px; color: var(--faint); }
.receipt li .amt { font: 600 15px var(--num); text-align: right; grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.receipt li.owned .amt { color: var(--good); }
.missing { color: var(--bad); font-size: 13px; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; }
.total-row span { font-size: 14px; color: var(--muted); }
.total-row b { font: 600 32px var(--num); color: var(--path); }
.buy-row { padding-top: 6px; }
.buy-row b { font-size: 22px; color: var(--text); }
.buy-row small { display: block; font-size: 12px; color: var(--faint); }
.rmt { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.rmt-total dt { color: var(--text); font-weight: 600; }
.rmt-total dd { font-size: 18px; color: var(--path); }
.facts { margin: 12px 0 0; display: grid; gap: 6px; font-size: 14px; }
.facts div { display: flex; justify-content: space-between; gap: 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font: 600 14px var(--num); }
.link { display: inline-block; margin-top: 8px; padding: 0; border: 0; background: none; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.link:hover { color: var(--path); }
dialog.gen { width: min(460px, calc(100vw - 32px)); max-height: 88vh; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); }
dialog.gen::backdrop { background: rgba(5, 9, 18, .7); }
.gen-body { display: grid; gap: 12px; padding: 18px 20px 20px; }
.gen-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gen-head h2 { margin: 0; font: 400 20px var(--display); }
.gen-x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; cursor: pointer; }
.gen-x:hover { color: var(--text); }
.gen-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gen-fields label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.gen-fields input { width: 100%; background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--num); text-align: right; }
.gen-sum { font-size: 13px; color: var(--muted); line-height: 1.5; }
.gen-sum b { font-family: var(--num); color: var(--text); }
.gen-sum .bad { color: var(--bad); }
.gen-list { list-style: none; margin: 0; padding: 0; max-height: 42vh; overflow-y: auto; border-top: 1px solid var(--line); }
.gen-list li { padding: 9px 2px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.gen-list label { display: flex; align-items: center; gap: 10px; cursor: pointer; font: 600 15px var(--num); }
.gen-list li.posted label { color: var(--faint); text-decoration: line-through; }
.gen-actions { display: flex; justify-content: flex-end; }
.estimate { margin: 12px 0 0; font-size: 12px; color: var(--faint); line-height: 1.5; }
.verdict { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: var(--abyss-2); }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

.compare { padding: 20px; }
.compare h2, .section-title { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 4px; }
.compare p { margin: 0 0 12px; font-size: 13px; color: var(--faint); }
.compare button { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; width: 100%; text-align: left; background: var(--abyss-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; cursor: pointer; }
.compare button:hover { border-color: var(--path); }
.compare button[aria-pressed="true"] { border-color: var(--path); background: color-mix(in srgb, var(--path) 10%, var(--abyss-2)); }
.compare .opt { font-size: 14px; font-weight: 500; grid-column: 1; }
.compare .opt-sub { font-size: 12px; color: var(--faint); grid-column: 1; }
.compare .opt-total { grid-column: 2; grid-row: 1 / span 2; align-self: center; font: 600 15px var(--num); }
.best { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--abyss); background: var(--good); border-radius: 4px; padding: 1px 6px; vertical-align: 1px; }

/* 3. materials */
.section-title { margin: 0 0 10px; }
details.step { margin-bottom: 10px; }
details.step > summary { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 18px; cursor: pointer; list-style: none; }
details.step > summary::-webkit-details-marker { display: none; }
.badge { font: 600 12px var(--num); color: var(--abyss); background: var(--tc); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.step-name { font: 400 17px var(--display); }
.step-name small { display: block; font: 400 12px var(--body); color: var(--faint); }
.step-cost { font: 600 16px var(--num); text-align: right; }
.step-cost::after { content: "▾"; margin-left: 10px; color: var(--faint); display: inline-block; transition: transform .2s; }
details[open] .step-cost::after { transform: rotate(180deg); }
table { width: 100%; border-collapse: collapse; }
th { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); text-align: right; padding: 8px 18px 6px; border-top: 1px solid var(--line); }
th:first-child { text-align: left; }
td { padding: 7px 18px; border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); text-align: right; white-space: nowrap; }
td:first-child { text-align: left; white-space: normal; }
.mat { display: flex; align-items: center; gap: 10px; }
.swatch { width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; flex: none; background: var(--fam, var(--stone)); }
.fam-wrath { --fam: var(--wrath); } .fam-balaur { --fam: var(--balaur); } .fam-radiant { --fam: var(--radiant); }
.fam-stone { --fam: var(--stone); } .fam-gear { --fam: var(--unique); }
.qty { font: 600 14px var(--num); color: var(--muted); }
.price-in { width: 116px; text-align: right; background: var(--abyss-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-family: var(--num); }
.price-in.override { border-color: var(--unique); color: var(--unique); }
.price-in::placeholder { color: var(--muted); }
.listed { font-size: 12px; color: var(--faint); }
.listed.thin { color: var(--bad); }
.subtotal { font-family: var(--num); font-weight: 600; }
.trend { display: block; font: 600 11px var(--num); margin-top: 3px; color: var(--faint); }
.trend.up { color: var(--bad); }
.trend.down { color: var(--good); }
.shop .trend, .g2g .trend { display: inline; margin: 0 0 0 8px; }
.steps-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.steps-head .section-title { margin: 0; }
.trend-pick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.trend-pick .seg { grid-template-columns: repeat(4, auto); }
.trend-pick .seg button { padding: 4px 10px; font-size: 13px; }
.trend-sum { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: var(--abyss-2); color: var(--muted); }
.trend-sum b { font-family: var(--num); }
.trend-sum .up { color: var(--bad); } .trend-sum .down { color: var(--good); }

.shop { padding: 18px 20px; margin-top: 20px; }
.shop ul { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 32px; }
.shop li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 14px; break-inside: avoid; }
.shop .q { font-family: var(--num); color: var(--muted); }
.note { font-size: 12px; color: var(--faint); line-height: 1.6; margin-top: 18px; }

@media (max-width: 820px) {
  .answer, .choices { grid-template-columns: 1fr; }
  .spacer { display: none; }
  .shop ul { columns: 1; }
}
@media (max-width: 560px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  h1 { font-size: 23px; }
  th:nth-child(4), td:nth-child(4) { display: none; }
  td, th { padding-left: 10px; padding-right: 10px; }
  .price-in { width: 90px; }
  details.step > summary { grid-template-columns: 1fr auto; }
  .badge { grid-column: 1 / -1; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">Transfer Crafting Calculator</div>
  <span class="chip">Server <b>Siel · NAW</b></span>
  <div class="status" id="status" data-state="idle"><span class="dot"></span><span id="status-text">Waiting</span></div>
  <button class="btn" id="refresh" type="button">Refresh prices</button>
</header>

<main>
  <div class="card warn" id="api-warn" hidden></div>

  <section class="card choices" aria-label="What to craft">
    <label class="field"><span>Gear</span><select id="slot"></select></label>
    <div class="field"><span>Goal</span>
      <div class="seg" role="group" aria-label="Goal">
        <button type="button" data-target="2">Splendent True</button>
        <button type="button" data-target="4">Splendent White</button>
        <button type="button" data-target="6">Splendent Wise</button>
      </div>
    </div>
    <label class="field"><span>Start with</span><select id="start"></select></label>
    <div class="field"><span class="spacer">&nbsp;</span>
      <label class="own"><input type="checkbox" id="owned"> I already own it (don't count its price)</label>
    </div>
    <div class="field rate-field"><span>Kinah value</span>
      <div class="rate"><span>$</span><input id="usd-rate" inputmode="decimal" aria-label="US dollars per 1 million kinah">
        <span>USD per 1M kinah</span>
        <select id="rate-mode" aria-label="Where the kinah value comes from">
          <option value="recommended">G2G recommended seller</option>
          <option value="trusted">G2G cheapest trusted seller</option>
          <option value="lowest">G2G cheapest offer</option>
          <option value="manual">My own rate</option>
        </select></div>
      <label class="tax">Market tax on delivery <input id="tax" inputmode="decimal" aria-label="Market tax percent on kinah delivery"> % of bought kinah is lost (buy 100M, receive 90M)</label>
      <label class="tax">G2G handling fee <input id="g2g-fee" inputmode="decimal" aria-label="G2G handling fee percent"> % added to the USD price</label>
      <div class="g2g" id="g2g-info"></div>
    </div>
  </section>

  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="answer">
    <section class="card receipt" id="receipt" aria-label="Cost breakdown"></section>
    <section class="card compare" id="compare" aria-label="Where to start"></section>
  </div>

  <div class="steps-head"><h2 class="section-title">Materials for each step</h2>
    <div class="trend-pick"><span>Price change over</span>
      <div class="seg" role="group" aria-label="Price change period" id="trend-win">
        <button type="button" data-win="1h">1h</button><button type="button" data-win="6h">6h</button>
        <button type="button" data-win="24h">24h</button><button type="button" data-win="7d">7d</button>
      </div></div></div>
  <div id="steps"></div>
  <section class="card shop" id="shop"></section>
  <p class="note" id="note"></p>
</main>

<dialog class="gen" id="gen" aria-labelledby="gen-title">
  <div class="gen-body">
    <div class="gen-head"><h2 id="gen-title">Listing prices</h2><button type="button" class="gen-x" id="gen-close" aria-label="Close">×</button></div>
    <div class="gen-fields">
      <label>Kinah bought <input id="gen-amount" inputmode="text" placeholder="100m"></label>
      <label>Size per listing <input id="gen-size" inputmode="text"></label>
    </div>
    <div class="gen-sum" id="gen-sum"></div>
    <ul class="gen-list" id="gen-list"></ul>
    <div class="gen-actions">
      <button type="button" class="btn" id="gen-new">New prices</button>
    </div>
  </div>
</dialog>

<script src="recipes.js"></script>
<script>
const SERVER = 11201; // Siel (NAW)
const API = location.protocol.startsWith("http") ? "/api" : "https://aion2.exchange/api";
const GREAT_SUCCESS = 0.25; // crafting True/White/Wise has a 25% chance to come out Splendent, skipping the next step
const CACHE_MS = 5 * 60 * 1000; // listings sell fast, so don't trust a saved price for long
const D = window.RECIPES;
const TIER_COLOR = ["--unique", "--true", "--true", "--white", "--white", "--wise", "--wise"];
const TIER_PATH = ["true", "true", "true", "white", "white", "wise", "wise"];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = {
  slot: store.get("fl2.slot", "Greatsword"),
  start: store.get("fl2.start", 1),     // tier you start with: 0 Artisan's base, 1 True ... 5 Wise
  owned: store.get("fl2.owned", false), // true = you already have the start item
  target: store.get("fl2.target", 6),   // 2, 4 or 6
  overrides: store.get("fl.overrides", {}),
  tax: store.get("fl2.tax", 10), // market tax % lost when RMT kinah is handed over through the market
  usdPerMil: store.get("fl2.usdPerMil", 0.8212), // RMT value of 1,000,000 kinah
  g2gFee: store.get("fl2.g2gFee", 3.99), // G2G handling fee %, paid on top of the listed USD price
  rateMode: store.get("fl2.rateMode", "recommended"), // recommended | trusted | lowest | manual
  win: store.get("fl2.win", "24h"), // price-change period: 1h | 6h | 24h | 7d
};
const WINDOWS = ["1h", "6h", "24h", "7d"]; // periods aion2.exchange accepts
const market = store.get("fl.market", {}); // name -> {found, price, listings, at, trend: {period: {pct, basis, at}}}
const inflight = new Map();

// ---------- data helpers ----------
const slotData = () => D.slots.find(s => s.slot === state.slot) || D.slots[0];
const tierItems = s => [s.base, ...s.steps.map(x => x.item)]; // index 0..6
function family(name) {
  if (/Wrathful/.test(name)) return "wrath";
  if (/Balaur/.test(name)) return "balaur";
  if (/^Radiant/.test(name)) return "radiant";
  if (/Refining Stone/.test(name)) return "stone";
  return "gear";
}
function priceOf(name) {
  if (state.overrides[name] != null) return state.overrides[name];
  const m = market[name];
  return m && m.found ? m.price : null;
}
// kinah you must buy on G2G to end up with n, since the market tax takes its cut on delivery
const toBuy = n => n / (1 - state.tax / 100);
const fmt = n => (n == null ? "—" : Math.round(n).toLocaleString("en-US"));
const money = v => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd = n => (n == null || !state.usdPerMil ? "" : money(toBuy(n) / 1e6 * state.usdPerMil * (1 + state.g2gFee / 100)));
const esc = t => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
function marketText(name) {
  const m = market[name], p = priceOf(name);
  if (state.overrides[name] != null) return `your price ${fmt(p)}`;
  if (!m) return "loading price…";
  if (!m.found) return "not listed on the market";
  return `${fmt(p)} on market${m.listings != null ? ` · ${m.listings} listed` : ""}`;
}

// % change of the cheapest listing over the chosen period (null when unknown)
function changeOf(name) {
  const t = market[name]?.trend?.[state.win];
  return t && Number.isFinite(t.pct) ? t : null;
}
function trendTag(name) {
  const t = changeOf(name);
  if (!t) return market[name]?.found && market[name]?.trend?.[state.win] ? `<span class="trend">no ${state.win} history</span>` : "";
  const dir = t.pct > 0.05 ? "up" : t.pct < -0.05 ? "down" : "flat";
  const since = t.basis ? ` (compared with ${t.basis >= 86400 ? `${(t.basis / 86400).toFixed(1)} days` : `${Math.max(1, Math.round(t.basis / 3600))} h`} ago)` : "";

// Cost of the same market items now vs at the start of the period (items with history only)
function trendSummary(list) {
  let now = 0, then = 0;
  for (const [n, q] of list) {
    const t = changeOf(n), m = market[n];
    if (!t || !m?.found || state.overrides[n] != null) continue;
    now += m.price * q; then += m.price / (1 + t.pct / 100) * q;
  }
  return then ? { diff: now - then, pct: (now / then - 1) * 100 } : null;
}

// ---------- market fetching ----------
function pick(item, words, avoid = []) {
  for (const [k, v] of Object.entries(item))
    if (typeof v === "number" && words.every(w => k.includes(w)) && !avoid.some(a => k.includes(a))) return v;
  return null;
}
const fresh = n => { const m = market[n], t = m?.trend?.[state.win]; return !!m && Date.now() - m.at < CACHE_MS && !!t && Date.now() - t.at < CACHE_MS; };
async function lookup(name, force = false) {
  const win = state.win, key = `${name}|${win}`;
  if (!force && fresh(name)) return market[name];
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    const qs = new URLSearchParams({ server: SERVER, q: name, sort: "name", order: "asc", window: win, limit: 50, offset: 0 });
    if (force) qs.set("fresh", Date.now()); // skip the server-side caches on Refresh
    const res = await fetch(`${API}/items?${qs}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const items = Array.isArray(data) ? data : data.items || [];
    const lc = name.toLowerCase();
    const it = items.find(i => (i.name || "").toLowerCase() === lc) || items.find(i => (i.name || "").toLowerCase().startsWith(lc));
    const price = it && (typeof it.price === "number" ? it.price : pick(it, ["min", "price"]) ?? pick(it, ["price"], ["change", "pct", "avg", "max", "sold"]));
    if (it && price == null) console.warn("Unrecognised price fields for", name, it);
    const trend = { ...(market[name]?.trend || {}), [win]: { pct: it?.change_pct ?? null, basis: it?.change_basis_seconds ?? null, at: Date.now() } };
    const rec = { found: !!it && it.listed !== false && price != null, price, listings: it ? it.listings ?? pick(it, ["listing"]) : null, at: Date.now(), trend };
    market[name] = rec;
    store.set("fl.market", market);
    return rec;

}
const namesFor = s => [...new Set([...tierItems(s), ...s.steps.flatMap(x => Object.keys(x.materials))])];
let loadToken = 0, lastError = null;
async function loadPrices(names, force = false) {
  if (force) names.forEach(n => { if (market[n]) market[n].at = 0; });
  const todo = names.filter(n => !fresh(n));
  if (!todo.length) { setStatus("live"); render(); return; }
  const token = ++loadToken;
  let done = 0, failed = 0;
  setStatus("loading", `Loading prices 0/${todo.length}`);
  const queue = [...todo];
  const worker = async () => {
    while (queue.length) {
      const n = queue.shift();
      try { await lookup(n, force); } catch (e) { failed++; lastError = e; }
      done++;
      if (token === loadToken) { setStatus("loading", `Loading prices ${done}/${todo.length}`); render(); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (token !== loadToken) return;
  setStatus(failed === todo.length ? "error" : "live");
  render();
}
function setStatus(st, text) {

function ago(t) {
  if (!t) return "never";

  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
}

// ---------- cost model ----------
function stepCost(step) {
  let sum = 0; const missing = [];
  for (const [n, q] of Object.entries(step.materials)) {
    const p = priceOf(n);
    if (p == null) missing.push(n); else sum += p * q;
  }
  return { sum, missing };
}
// Start with tier `from` (bought at market unless owned), craft each step up to tier `to`.
function route(s, from, to, owned) {
  const items = tierItems(s);
  const startPrice = owned ? 0 : priceOf(items[from]);
  const missing = startPrice == null ? [items[from]] : [];
  let full = startPrice || 0, luck = 0;
  for (let i = from + 1; i <= to; i++) {
    const c = stepCost(s.steps[i - 1]);
    full += c.sum; missing.push(...c.missing);
    if (i % 2 === 1 && i + 1 <= to) luck += GREAT_SUCCESS * stepCost(s.steps[i]).sum;
  }
  return { startPrice, full, expected: full - luck, missing: [...new Set(missing)] };
}

function g2gPick(mode) {

  if (mode === "recommended") return g2g.recommended[0] || null;

function g2gTrend(mode) {
  const now = g2gPick(mode), hist = (g2g?.history || []).filter(h => h[mode] != null);
  if (!now || !hist.length) return "";
  const span = WIN_SECONDS[state.win], target = g2g.at - span;
  // the snapshot closest to the start of the period; if history is shorter, the oldest one we have
  let base = [...hist].reverse().find(h => h.at <= target + span * 0.1) || hist[0];
  const age = g2g.at - base.at;
  if (age < Math.min(span * 0.5, 1800)) return ` <span class="trend">no ${state.win} history yet</span>`;
  const pct = (now.price / base[mode] - 1) * 100, dir = pct > 0.05 ? "up" : pct < -0.05 ? "down" : "flat";
  const since = age < span * 0.9 ? ` since ${age >= 86400 ? `${(age / 86400).toFixed(1)} days` : `${Math.max(1, Math.round(age / 3600))} h`} ago` : "";
  return ` <span class="trend ${dir}" title="Was $${base[mode]} ${ago(base.at * 1000)}">${dir === "up" ? "▲" : dir === "down" ? "▼" : "•"} ${Math.abs(pct).toFixed(1)}%${since}</span>`;
}

// ---------- listing price generator ----------
const GEN_MAX = 200, GEN_MIN = 10000;
// endings must be 100-998 and not all one digit (no 000, 111 ... 999)
const goodEnding = e => e >= 100 && e % 111 !== 0;
// Splits total into listings of about `size`, each a whole-thousands base plus its own ending. Endings are added
// on top and never deducted, so 100M at 10M each is 10 x 10,000,xxx and the listings never total less than the amount.
function listingPrices(total, size) {
  const n = Math.max(1, Math.round(total / size));
  const base = Math.ceil(total / n / 1000) * 1000;
  const pool = [];
  for (let e = 100; e < 999; e++) if (goodEnding(e)) pool.push(e);
  for (let i = 0; i < n; i++) { const j = i + Math.floor(Math.random() * (pool.length - i)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, n).map(e => base + e);
}
// accepts 100000000, 100,000,000, 100m or 2.5m
function parseKinah(text) {
  const t = String(text).trim().toLowerCase().replace(/,/g, "");
  const m = t.match(/^(\d+(?:\.\d+)?)m$/);
  const v = m ? Math.round(parseFloat(m[1]) * 1e6) : parseInt(t.replace(/[^\d]/g, ""), 10);
  return Number.isFinite(v) ? v : 0;
}

  genEl("gen").showModal();
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.id === "gen-open") return genOpen();
  if (t.id === "gen-close" || t.id === "gen") return genEl("gen").close(); // the dialog itself is only hit on its backdrop
  if (t.id === "gen-new" && genMayReplace()) return genCreate();
  if (t.id === "gen-use-calc" && genMayReplace()) { gen.amount = calculatorAmount(); return genCreate(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.genI != null) { gen.list[+t.dataset.genI].posted = t.checked; saveGen(); return genRender(); }
  if (t.id !== "gen-amount" && t.id !== "gen-size") return;
  if (!genMayReplace()) return genRender();
  gen[t.id === "gen-amount" ? "amount" : "size"] = parseKinah(t.value);
  genCreate();
});

// ---------- events ----------
const save = () => { store.set("fl2.slot", state.slot); store.set("fl2.start", state.start); store.set("fl2.owned", state.owned); store.set("fl2.target", state.target); };
document.addEventListener("click", e => {
  const win = e.target.closest("#trend-win button");
  if (win) { state.win = win.dataset.win; store.set("fl2.win", state.win); applyG2G(); render(); return loadPrices(namesFor(slotData())); }
  const seg = e.target.closest(".seg button[data-target]");
  if (seg) { state.target = +seg.dataset.target; save(); return render(); }
  const opt = e.target.closest(".compare button");
  if (opt) { state.start = +opt.dataset.start; state.owned = false; save(); return render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "slot") { state.slot = t.value; save(); render(); return loadPrices(namesFor(slotData())); }
  if (t.id === "start") { state.start = +t.value; save(); return render(); }
  if (t.id === "owned") { state.owned = t.checked; save(); return render(); }
  if (t.id === "rate-mode") { state.rateMode = t.value; store.set("fl2.rateMode", state.rateMode); applyG2G(); return render(); }
  if (t.id === "g2g-fee") {
    const v = parseFloat(t.value.replace(/[^\d.]/g, ""));
    state.g2gFee = Number.isFinite(v) ? Math.min(v, 100) : 0; store.set("fl2.g2gFee", state.g2gFee); t.value = state.g2gFee; return render();
  }
  if (t.id === "tax") {
    const v = parseFloat(t.value.replace(/[^\d.]/g, ""));
    state.tax = Number.isFinite(v) ? Math.min(v, 90) : 0; store.set("fl2.tax", state.tax); t.value = state.tax; return render();
  }
  if (t.id === "usd-rate") {
    const v = parseFloat(t.value.replace(/[^\d.]/g, ""));
    state.usdPerMil = Number.isFinite(v) ? v : 0; store.set("fl2.usdPerMil", state.usdPerMil); return render();
  }
  if (t.classList.contains("price-in")) {
    const v = parseInt(t.value.replace(/[^\d]/g, ""), 10);
    if (Number.isFinite(v)) state.overrides[t.dataset.name] = v; else delete state.overrides[t.dataset.name];
    store.set("fl.overrides", state.overrides); render();
  }
});
document.getElementById("refresh").addEventListener("click", () => loadPrices(namesFor(slotData()), true));

if (![2, 4, 6].includes(state.target)) state.target = 6;
if (!WINDOWS.includes(state.win)) state.win = "24h";
document.getElementById("usd-rate").value = state.usdPerMil || "";
document.getElementById("tax").value = state.tax;
document.getElementById("g2g-fee").value = state.g2gFee;
document.getElementById("rate-mode").value = state.rateMode;
applyG2G();
loadG2G();
setInterval(loadG2G, 10 * 60 * 1000);
render();
loadPrices(namesFor(slotData()));
setInterval(() => loadPrices(namesFor(slotData())), CACHE_MS);
</script>
</body>
</html>
